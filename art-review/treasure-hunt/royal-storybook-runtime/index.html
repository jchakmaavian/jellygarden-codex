<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>King Leo · Royal Storybook in game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:#142e5e;font:16px system-ui,sans-serif}
header{padding:32px clamp(20px,5vw,70px);border-bottom:1px solid #dcaf55}h1{margin:0 0 8px;font-size:clamp(25px,4vw,40px)}
p{line-height:1.5;margin:8px 0;color:#74634c}a{color:#1557ae}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
button,select{font:inherit;border:1px solid #bf9346;border-radius:20px;padding:9px 18px;background:#fffdf5;color:#142e5e;cursor:pointer}
button[aria-pressed=true]{background:#125abd;color:white}
main{padding:30px clamp(20px,5vw,70px);display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:28px;align-items:start}
figure{margin:0;max-width:393px;width:100%;justify-self:center}figcaption{font-weight:700;margin:0 0 12px}
img{display:block;width:100%;border:2px solid #dcae4f;border-radius:18px;background:#142e5e;box-shadow:0 8px 20px #51300c15}
small{display:block;margin-top:10px;color:#75654e;line-height:1.5}
dialog{border:0;padding:20px;background:#fff8e9;max-width:95vw;max-height:96vh;border-radius:20px}dialog::backdrop{background:#071328cf}
dialog img{width:auto;max-width:85vw;max-height:80vh;margin:12px auto}dialog button{display:block;margin-left:auto}
</style>
<header><h1>Royal Storybook, in game</h1>
<p>Real Unity captures of the selected design. Tap any screen to enlarge it.</p>
<p><a href="../ui-directions/v1/01-royal-storybook.png">Approved direction</a> · <a href="validation.md">Validation notes</a></p>
<div class="controls"><button data-small="false" aria-pressed="true">393 × 852</button><button data-small="true" aria-pressed="false">320 × 568</button>
<label for="screen">Screen </label><select id="screen"><option value="">All screens</option></select></div>
</header><main id="gallery"></main>
<dialog id="zoom"><button id="close">Close</button><img id="large" alt=""><p id="caption"></p></dialog>
<script>
const screens=[
['Home','v2/normal/','state-2','Two tasks complete; the next repair is royal flags.'],
['Area tasks','v2/normal/','task-3','Task order and star prices come from the saved campaign.'],
['Before level','v3/first-task/','ui-before-level-3','The real 500-point goal and owned boosters.'],
['Level complete','v3/first-task/','level-1-win','First-win reward: exactly one star.'],
['Gameplay','v3/first-task/','board-1','Two goals, remaining moves, and the preserved match-3 board.'],
['Pause','v3/first-task/','pause-1','Existing audio and navigation actions in the new paper panel.'],
['Kingdom map','v3/first-task/','ui-map','Castle Gates comes first; later areas remain locked.'],
['Collection','v4/ending/','ui-earned-collection','The sun clue appears only after its discovery scene is earned.'],
['Settings','v3/first-task/','ui-settings','Reset keeps its existing confirmation step.'],
['Out of moves','v3/first-task/','ui-out-of-moves','No star reward is shown for a loss.'],
['Dialogue','v3/first-task/','opening-1','The approved short opening, with Pip and six empty key spaces.'],
['Area complete','v4/ending/','completed-panel-4','The discovered sun, replay action, and upcoming courtyard.']
];
let small=false;
const gallery=document.querySelector('#gallery'), filter=document.querySelector('#screen'), zoom=document.querySelector('#zoom');
screens.forEach(([name])=>{const o=document.createElement('option');o.value=o.textContent=name;filter.append(o)});
function render(){
gallery.replaceChildren();
screens.filter(([name])=>!filter.value||filter.value===name).forEach(([name,dir,file,note])=>{
const f=document.createElement('figure'), c=document.createElement('figcaption'), img=document.createElement('img'), s=document.createElement('small');
c.textContent=name;img.src=dir+(small?'small-phone-':'')+file+'.png';img.alt=name+' in Royal Storybook';img.loading='lazy';img.tabIndex=0;s.textContent=note;
function open(){document.querySelector('#large').src=img.src;document.querySelector('#large').alt=img.alt;document.querySelector('#caption').textContent=name;zoom.showModal()}
img.onclick=open;img.onkeydown=e=>{if(e.key==='Enter')open()};f.append(c,img,s);gallery.append(f);
});
}
document.querySelectorAll('[data-small]').forEach(b=>b.onclick=()=>{small=b.dataset.small==='true';document.querySelectorAll('[data-small]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
filter.onchange=render;document.querySelector('#close').onclick=()=>zoom.close();render();
</script></html>
