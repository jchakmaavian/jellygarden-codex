<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>King Leo — Five HUD Designs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121c2a;color:#fff3d4;font-family:system-ui,sans-serif}main{max-width:1900px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 8px}p{color:#b6c5d8;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.card{padding:0;border:1px solid #435066;border-radius:16px;background:#1d2a3b;color:inherit;overflow:hidden;cursor:zoom-in;text-align:left;transition:transform .15s}.card:hover{transform:translateY(-5px);border-color:#efc06a}.label{display:flex;align-items:center;gap:10px;padding:14px;font-size:15px;font-weight:650}.label b{display:grid;place-items:center;border-radius:50%;background:#f2c369;color:#192335;width:27px;height:27px;flex-shrink:0}img{display:block;width:100%;height:auto}dialog{border:1px solid #718197;background:#121c2a;color:#fff3d4;border-radius:14px;padding:15px;max-height:96vh;max-width:95vw}dialog::backdrop{background:#000c}dialog img{max-height:82vh;width:auto;max-width:85vw;object-fit:contain;margin:auto}dialog header{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-bottom:12px}dialog button{background:#2e4058;border:0;border-radius:8px;padding:8px 13px;color:white;cursor:pointer}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){main{padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.label{padding:10px;font-size:12px;gap:7px}}
</style><main><h1>King Leo · HUD concepts</h1><p>Five directions for your game. Select a preview to inspect it at full size.</p><div class="grid"><button class="card" onclick="show('01-royal-blue.png', '1. Royal Blue')"><div class="label"><b>1</b><span>Royal Blue</span></div><img src="01-royal-blue.png" alt="Royal Blue HUD design preview"></button>
<button class="card" onclick="show('02-emerald-court.png', '2. Emerald Court')"><div class="label"><b>2</b><span>Emerald Court</span></div><img src="02-emerald-court.png" alt="Emerald Court HUD design preview"></button>
<button class="card" onclick="show('03-crimson-banners.png', '3. Crimson Banners')"><div class="label"><b>3</b><span>Crimson Banners</span></div><img src="03-crimson-banners.png" alt="Crimson Banners HUD design preview"></button>
<button class="card" onclick="show('04-compact-crown.png', '4. Compact Crown')"><div class="label"><b>4</b><span>Compact Crown</span></div><img src="04-compact-crown.png" alt="Compact Crown HUD design preview"></button>
<button class="card" onclick="show('05-ivory-palace.png', '5. Ivory Palace')"><div class="label"><b>5</b><span>Ivory Palace</span></div><img src="05-ivory-palace.png" alt="Ivory Palace HUD design preview"></button></div></main>
<dialog id="preview"><header><strong id="name"></strong><button onclick="document.getElementById('preview').close()">Close</button></header><img id="large" alt=""></dialog>
<script>function show(src,name){document.getElementById('large').src=src;document.getElementById('large').alt=name;document.getElementById('name').textContent=name;document.getElementById('preview').showModal()}</script>
</html>
