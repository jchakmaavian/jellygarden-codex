<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Throne | Level complete motion preview</title><link rel="stylesheet" href="preview.css"></head>
<body><main>
  <div class="review-label">ROYAL THRONE <span>Level complete</span></div>
  <div class="viewport"><div class="scene" aria-label="Level complete motion preview">
    <div class="world"></div><div class="dim"></div>
    <div class="balance"><img src="assets/coin.png" alt=""><span>70</span></div>
    <div class="card" role="group" aria-label="Level 23 completed">
      <div class="surface" aria-hidden="true"></div>
      <img class="crest" src="assets/crest.png" alt="">
      <div class="level-label">LEVEL</div><div class="level-number">23</div>
      <button class="close" type="button" aria-label="Continue and close"><span></span><span></span></button>
      <h1 class="heading">Well Done!</h1>
      <div class="rays" aria-hidden="true"></div><div class="halo" aria-hidden="true"></div>
      <div class="halo-sparkles" aria-hidden="true"></div><div class="impact-flash" aria-hidden="true"></div>
      <img class="cushion" src="assets/cushion.webp" alt="Crimson velvet pillow with gold braid">
      <div class="pillow-light" aria-hidden="true"></div><div class="contact-shadow" aria-hidden="true"></div>
      <img class="star-shadow" src="assets/star.webp" alt="">
      <img class="star" src="assets/star.webp" alt="One gold reward star">
      <div class="sparkles" aria-hidden="true"></div>
      <div class="reward"><img src="assets/coin.png" alt="Coins"><span>+65</span></div>
      <button class="continue" type="button"><span class="button-face"></span><span class="button-gloss"></span><span class="button-sheen"></span><span class="caption">Continue</span></button>
      <div class="ornament" aria-hidden="true"><i></i></div>
      <div class="flying-coins" aria-hidden="true"></div>
    </div>
  </div></div>
  <div class="controls"><button id="replay" type="button">Replay animation</button><label><input id="reduced" type="checkbox"> Reduced motion</label><span id="status" aria-live="polite">Playing</span></div>
  <div class="timeline"><label for="scrub">Preview time</label><input id="scrub" type="range" min="0" max="6" step="0.016667" value="0"><output id="time">0.00 s</output></div>
</main><script src="config.js"></script><script src="preview.js"></script></body></html>
